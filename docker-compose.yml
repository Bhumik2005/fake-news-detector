services:

  db:
    image: postgres:15-alpine
    container_name: fakenews_db
    environment:
      POSTGRES_USER: fakenews
      POSTGRES_PASSWORD: fakenews
      POSTGRES_DB: fakenews
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fakenews"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: fakenews_backend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./reports:/app/reports
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://fakenews:fakenews@db:5432/fakenews
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: fakenews_frontend
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: